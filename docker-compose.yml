# ============================================================
#  StudyMatch - Docker Compose
#  Proyecto: IHC - Segundo Proyecto
#  Red aislada: studymatch_net (no interfiere con otros proyectos)
# ============================================================

name: studymatch

services:

  # ── PostgreSQL ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: studymatch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: studymatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: studymatch123
    volumes:
      - studymatch_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # Puerto 5433 en el host para no chocar con tu PostgreSQL local
    networks:
      - studymatch_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studymatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studymatch_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:studymatch123@db:5432/studymatch
      SECRET_KEY: studymatch_jwt_secret_key_2026_ihc_proyecto2
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - studymatch_net
    volumes:
      - ./backend:/app   # Hot reload: cambios en el código se reflejan al instante

  # ── Frontend React ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studymatch_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - studymatch_net
    volumes:
      - ./frontend:/app          # Hot reload
      - /app/node_modules        # Preserve node_modules del contenedor

# ── Volúmenes ────────────────────────────────────────────
volumes:
  studymatch_pgdata:
    name: studymatch_pgdata

# ── Red aislada ──────────────────────────────────────────
networks:
  studymatch_net:
    name: studymatch_net
    driver: bridge
